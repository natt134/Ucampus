<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UCampus · Universidad de Cundinamarca</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#0B7A3E;--gd:#07522A;--y:#F2B705;--yl:#FFF3C4;--bg:#F4F6F2;--card:#fff;--line:#E3E8E0;--ink:#15201A;--soft:#5E6B62;--red:#C8432F;--gl:#E0F1E6;
--fd:'Bricolage Grotesque',system-ui,sans-serif;--fb:'DM Sans',system-ui,sans-serif}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1410;--card:#16201A;--line:#25332A;--ink:#EAF1EC;--soft:#A3B2A8;--gl:#193526;--yl:#3B3210}}
:root[data-theme="dark"]{--bg:#0D1410;--card:#16201A;--line:#25332A;--ink:#EAF1EC;--soft:#A3B2A8;--gl:#193526;--yl:#3B3210}
*{box-sizing:border-box}html,body{margin:0;height:auto}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--fb)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{display:grid;grid-template-columns:240px minmax(0,600px) 300px;gap:28px;max-width:1220px;margin:0 auto;padding:0 20px;justify-content:center}
.rail,.side{position:sticky;top:0;align-self:start;padding:22px 0;height:100vh;overflow:auto}
.logo{font:800 26px var(--fd);color:var(--g);display:flex;align-items:center;gap:10px;margin-bottom:22px;letter-spacing:-.5px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--g);display:grid;place-items:center;color:var(--y);font:800 18px var(--fd);font-style:normal}
.logo small{display:block;font:500 11px var(--fb);color:var(--soft);letter-spacing:0}
.nav button{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border-radius:12px;font-weight:500;font-size:16px;color:var(--soft)}
.nav button:hover{background:var(--gl)}
.nav button.on{color:var(--ink);font-weight:700;background:var(--gl)}
.nav button.on svg{stroke:var(--g);stroke-width:2.3}
.cta{margin-top:14px;width:100%;background:var(--g);color:#fff;border-radius:12px;padding:12px;font-weight:700;display:flex;gap:8px;justify-content:center}
.cta:hover{background:var(--gd)}
.me{margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.me label{font-size:12px;color:var(--soft);display:block;margin:8px 0 4px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.top{display:flex;gap:10px;align-items:center;padding:14px 0 6px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search input{border:0;background:none;padding:11px 0}.search input:focus{outline:0}
.search:focus-within{border-color:var(--g)}
.ico{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.stories{display:flex;gap:16px;overflow-x:auto;padding:12px 2px 14px;scrollbar-width:none}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--soft);min-width:68px}
.st .ring{padding:3px;border-radius:50%;background:conic-gradient(var(--y),var(--g),var(--y))}
.st.on .ring{background:var(--ink)}
.st .in{width:58px;height:58px;border-radius:50%;border:3px solid var(--bg);display:grid;place-items:center;color:#fff}
.st.on{color:var(--ink);font-weight:600}
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:18px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ph b{display:block;font-size:14px}.ph span{font-size:12px;color:var(--soft)}
.ph .more{margin-left:auto;display:flex;gap:2px}
.more button{padding:6px;border-radius:8px;color:var(--soft)}.more button:hover{background:var(--gl)}
.cover{position:relative;aspect-ratio:16/9;color:#fff;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.cover::before{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;border:34px solid rgba(255,255,255,.14)}
.cover::after{content:"";position:absolute;right:50px;bottom:-60px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1)}
.cover h2{font:800 clamp(22px,4vw,30px)/1.1 var(--fd);margin:0;letter-spacing:-.5px;position:relative;z-index:1;max-width:80%}
.tag{position:absolute;top:14px;left:14px;z-index:1;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600}
.date{position:absolute;top:12px;right:14px;z-index:1;background:#fff;color:#15201A;border-radius:12px;text-align:center;padding:6px 12px;line-height:1.1}
.date b{display:block;font:800 22px var(--fd)}.date span{font-size:11px;font-weight:600;color:var(--g)}
.acts{display:flex;align-items:center;gap:4px;padding:8px 10px 0}
.acts button{display:flex;gap:6px;align-items:center;padding:7px 9px;border-radius:10px;font-size:14px;font-weight:500}
.acts button:hover{background:var(--gl)}
.acts .liked svg{fill:var(--red);stroke:var(--red)}.acts .saved svg{fill:var(--y);stroke:var(--y)}
.acts .sv{margin-left:auto}
.body{padding:4px 16px 14px}
.body p{margin:6px 0}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--soft);margin:8px 0}
.meta span{display:flex;gap:5px;align-items:center}.meta svg{width:15px;height:15px}
.reg{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;background:var(--gl);border-radius:12px;font-size:13px}
.reg .bar{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}.reg .bar i{display:block;height:100%;background:var(--g)}
.reg button{background:var(--g);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px}
.reg button.done{background:var(--y);color:#15201A}
.reg button:disabled{opacity:.5;cursor:default}
.cm{border-top:1px solid var(--line);padding:10px 16px 14px}
.cm .c{display:flex;gap:9px;margin:8px 0;font-size:14px}.cm .av{width:28px;height:28px;font-size:11px}
.cm form,.cf{display:flex;gap:8px;margin-top:8px}
.cf button{background:var(--g);color:#fff;border-radius:10px;padding:0 14px;font-weight:700}
.err{color:var(--red);font-size:12.5px;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
.panel h3{font:700 16px var(--fd);margin:0 0 10px}
.up{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.up:first-of-type{border:0}
.up .d{width:44px;text-align:center;background:var(--yl);border-radius:10px;padding:5px 0;line-height:1.1;flex-shrink:0}
.up .d b{display:block;font:800 18px var(--fd)}.up .d span{font-size:10.5px;font-weight:700;color:var(--gd)}
.up small{color:var(--soft);display:block}
.empty{text-align:center;padding:48px 20px;color:var(--soft);background:var(--card);border:1px dashed var(--line);border-radius:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:60;padding:16px}
.modal.open{display:grid}
.sheet{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.sheet h3{font:800 20px var(--fd);margin:0 0 12px}
.sheet label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.row{display:flex;gap:10px}.row>*{flex:1}
.sheet .btns{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.btn2{padding:10px 16px;border-radius:10px;border:1px solid var(--line);font-weight:600}
.btn1{padding:10px 18px;border-radius:10px;background:var(--g);color:#fff;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.tabs{display:none}
@media (max-width:1060px){.app{grid-template-columns:76px minmax(0,600px)}.side{display:none}.rail .t,.logo span,.me,.cta span{display:none}.nav button{justify-content:center}.logo{justify-content:center}.cta{padding:12px 0}}
@media (max-width:700px){.app{display:block;padding:0 12px 84px}.rail{display:none}
.tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:50;justify-content:space-around}
.tabs button{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--soft);padding:6px 10px;gap:2px}.tabs button.on{color:var(--g);font-weight:700}
.tabs .plus{background:var(--g);color:#fff;border-radius:14px;padding:10px 16px;margin-top:-4px}.mlogo{display:flex!important}}
.mlogo{display:none;font:800 22px var(--fd);color:var(--g);align-items:center;gap:8px;padding-top:12px}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="logo"><i>U</i><span>UCampus<small>Univ. de Cundinamarca</small></span></div>
    <nav class="nav" id="nav"></nav>
    <button class="cta" id="newBtn" data-new><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Publicar</span></button>
    <div class="me">
      <div style="display:flex;gap:10px;align-items:center"><div class="av" style="background:var(--g)" id="meAv">VR</div><div><b id="meName">Valentina Rojas</b><div style="font-size:12px;color:var(--soft)" id="meSub">Ing. de Sistemas</div></div></div>
      <label for="roleSel">Ver como (demo de roles)</label>
      <select id="roleSel"><option value="ESTUDIANTE">Estudiante</option><option value="BIENESTAR">Bienestar Universitario</option><option value="ADMIN">Administrador</option></select>
    </div>
  </aside>

  <main>
    <div class="mlogo"><span class="logo" style="margin:0"><i>U</i>UCampus</span></div>
    <div class="top">
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Buscar eventos, convocatorias, noticias" aria-label="Buscar"></label>
      <button class="ico" id="theme" aria-label="Cambiar tema"><svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg></button>
    </div>
    <div class="stories" id="stories" aria-label="Categorías"></div>
    <div id="feed"></div>
  </main>

  <aside class="side">
    <div class="panel"><h3>Próximos eventos</h3><div id="upcoming"></div></div>
    <div class="panel"><h3>Tus inscripciones</h3><div id="mine" style="font-size:14px;color:var(--soft)"></div></div>
    <p style="font-size:12px;color:var(--soft)">UCampus es un espacio centralizado para eventos, convocatorias y noticias de la comunidad universitaria.</p>
  </aside>
</div>

<div class="tabs" id="tabs"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="sheet">
    <h3 id="mt">Nueva publicación</h3>
    <label for="fTitulo">Título</label><input id="fTitulo" maxlength="80">
    <div class="row"><div><label for="fTipo">Tipo</label><select id="fTipo"><option value="evento">Evento</option><option value="convocatoria">Convocatoria</option><option value="noticia">Noticia</option></select></div>
    <div><label for="fCat">Categoría</label><select id="fCat"></select></div></div>
    <label for="fDesc">Descripción</label><textarea id="fDesc" rows="3"></textarea>
    <div class="row"><div><label for="fFecha">Fecha</label><input id="fFecha" type="date"></div><div><label for="fCupo">Cupo (opcional)</label><input id="fCupo" type="number" min="1"></div></div>
    <label for="fLugar">Lugar</label><input id="fLugar" placeholder="Ej. Auditorio principal">
    <div class="err" id="fErr" role="alert"></div>
    <div class="btns"><button class="btn2" id="fCancel">Cancelar</button><button class="btn1" id="fSave">Publicar</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const ic={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 mega:'<path d="M3 11v2a1 1 0 001 1h3l8 4V6L7 10H4a1 1 0 00-1 1zM19 9a4 4 0 010 6"/>',
 news:'<path d="M5 4h14v16H5zM9 8h6M9 12h6M9 16h3"/>',
 save:'<path d="M6 3h12v18l-6-4-6 4z"/>',
 heart:'<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z"/>',
 chat:'<path d="M21 12a8 8 0 01-11.5 7.2L3 21l1.8-5.5A8 8 0 1121 12z"/>',
 pin:'<path d="M12 21s7-6 7-12a7 7 0 10-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 plus:'<path d="M12 5v14M5 12h14"/>'
};
const I=(n,s)=>`<svg viewBox="0 0 24 24"${s?` style="${s}"`:''}>${ic[n]}</svg>`;
const CAT={ACADÉMICO:['#0B7A3E','#07522A'],DEPORTIVO:['#C8432F','#8E2A1B'],CULTURAL:['#7A3EA8','#4F2275'],BIENESTAR:['#E0A400','#A87500'],TALLER:['#127C8F','#0A5260']};
const MES=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
// Datos en memoria (reflejan tablas: usuarios, roles, categorias_evento, eventos, publicaciones, comentarios, eventos_guardados, inscripciones_evento)
const users={1:{n:'Valentina Rojas',s:'Ing. de Sistemas',c:'#0B7A3E'},2:{n:'Bienestar Universitario',s:'Cuenta oficial',c:'#E0A400'},3:{n:'Camilo Peña',s:'Docente · Ingeniería',c:'#127C8F'},4:{n:'Laura Méndez',s:'Administración',c:'#7A3EA8'},5:{n:'Deportes UdeC',s:'Cuenta oficial',c:'#C8432F'}};
const d=(m,day)=>new Date(2026,m,day);
let posts=[
 {id:1,u:5,tipo:'evento',cat:'DEPORTIVO',t:'Torneo interfacultades de fútbol',x:'Arranca la fase de grupos. Ingeniería vs Ciencias Administrativas abre la jornada. Trae a tu facultad.',f:d(9,10),lugar:'Cancha principal',cupo:120,ins:84,likes:41,t0:2},
 {id:2,u:2,tipo:'convocatoria',cat:'ACADÉMICO',t:'Convocatoria de movilidad estudiantil 2027-1',x:'Intercambio con universidades aliadas. Requisitos: promedio mínimo de 3.8 y haber aprobado el 50 % de los créditos.',f:d(9,25),lugar:'Oficina de Relaciones Internacionales',cupo:30,ins:12,likes:67,t0:5},
 {id:3,u:3,tipo:'evento',cat:'ACADÉMICO',t:'Semillero de Inteligencia Artificial',x:'Segunda sesión abierta: entrenamos un modelo pequeño con datos del campus. No necesitas experiencia previa.',f:d(9,8),lugar:'Sala de cómputo 3',cupo:40,ins:27,likes:35,t0:9},
 {id:4,u:2,tipo:'evento',cat:'TALLER',t:'Taller de pintura mural',x:'Nueva jornada del mural colaborativo del bloque de bienestar. Materiales incluidos.',f:d(9,15),lugar:'Bloque de Bienestar',cupo:25,ins:25,likes:52,t0:20},
 {id:5,u:4,tipo:'noticia',cat:'BIENESTAR',t:'Biblioteca abre hasta las 10 p. m.',x:'Se amplió el horario de la biblioteca central entre semana. Más tiempo para estudiar antes de parciales.',f:null,lugar:'',cupo:0,ins:0,likes:88,t0:30},
 {id:6,u:2,tipo:'evento',cat:'CULTURAL',t:'Noche de talentos UdeC',x:'Música, monólogos y danza hechos por estudiantes. Inscribe tu acto en Bienestar antes del viernes.',f:d(9,30),lugar:'Auditorio principal',cupo:200,ins:131,likes:120,t0:48}
];
let com={1:[[4,'¡Vamos Ingeniería!']],2:[[1,'¿El plazo se puede extender?'],[2,'No, el cierre es el 25 de octubre.']],3:[],4:[],5:[[1,'Por fin 🙌']],6:[]};
let st={tab:'inicio',cat:null,q:'',role:'ESTUDIANTE',liked:new Set(),saved:new Set(),enrolled:new Set(),open:new Set(),edit:null,nid:7};
const $=s=>document.querySelector(s);
const canPost=()=>st.role!=='ESTUDIANTE';
const ago=h=>h<1?'ahora':h<24?`hace ${h} h`:`hace ${Math.floor(h/24)} d`;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('');
const TABS=[['inicio','Inicio','home'],['evento','Eventos','cal'],['convocatoria','Convocatorias','mega'],['noticia','Noticias','news'],['guardados','Guardados','save']];
function nav(){
 $('#nav').innerHTML=TABS.map(([k,l,i])=>`<button data-tab="${k}" class="${st.tab===k?'on':''}">${I(i)}<span class="t">${l}</span></button>`).join('');
 const m=[TABS[0],TABS[1],TABS[2],TABS[4]].map(([k,l,i])=>`<button data-tab="${k}" class="${st.tab===k?'on':''}">${I(i)}${l}</button>`);
 m.splice(2,0,`<button class="plus" data-new aria-label="Publicar">${I('plus')}</button>`);
 $('#tabs').innerHTML=m.join('');
}
function stories(){
 $('#stories').innerHTML=Object.keys(CAT).map(c=>`<button class="st ${st.cat===c?'on':''}" data-cat="${c}"><span class="ring"><span class="in" style="background:linear-gradient(135deg,${CAT[c][0]},${CAT[c][1]})">${c[0]}</span></span>${c[0]+c.slice(1).toLowerCase()}</button>`).join('');
}
function post(p){
 const u=users[p.u],g=CAT[p.cat],lk=st.liked.has(p.id),sv=st.saved.has(p.id),en=st.enrolled.has(p.id),n=p.ins+(en?1:0),full=p.cupo&&n>=p.cupo&&!en;
 const mine=st.role==='ADMIN'||(st.role==='BIENESTAR'&&[2,5].includes(p.u));
 const cs=com[p.id]||[],open=st.open.has(p.id);
 return `<article class="post" data-id="${p.id}">
 <div class="ph"><div class="av" style="background:${u.c}">${ini(u.n)}</div><div><b>${u.n}</b><span>${u.s} · ${ago(p.t0)}</span></div>
 ${mine?`<div class="more"><button data-edit aria-label="Editar">${I('edit','width:18px;height:18px')}</button><button data-del aria-label="Eliminar">${I('trash','width:18px;height:18px')}</button></div>`:''}</div>
 <div class="cover" style="background:linear-gradient(135deg,${g[0]},${g[1]})"><span class="tag">${p.cat[0]+p.cat.slice(1).toLowerCase()} · ${p.tipo}</span>
 ${p.f?`<div class="date"><b>${p.f.getDate()}</b><span>${MES[p.f.getMonth()]}</span></div>`:''}<h2>${esc(p.t)}</h2></div>
 <div class="acts"><button data-like class="${lk?'liked':''}" aria-pressed="${lk}">${I('heart')}${p.likes+(lk?1:0)}</button><button data-cm>${I('chat')}${cs.length}</button><button data-save class="sv ${sv?'saved':''}" aria-label="Guardar" aria-pressed="${sv}">${I('save')}</button></div>
 <div class="body"><p>${esc(p.x)}</p>
 ${p.f||p.lugar?`<div class="meta">${p.f?`<span>${I('clock')}${p.f.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'})}</span>`:''}${p.lugar?`<span>${I('pin')}${esc(p.lugar)}</span>`:''}</div>`:''}
 ${p.cupo?`<div class="reg"><div style="flex:1"><div style="margin-bottom:5px"><b>${n}</b> de ${p.cupo} cupos</div><div class="bar"><i style="width:${Math.min(100,n/p.cupo*100)}%"></i></div></div><button data-enroll class="${en?'done':''}" ${full?'disabled':''}>${en?'Inscrito ✓':full?'Cupo lleno':p.tipo==='convocatoria'?'Postularme':'Inscribirme'}</button></div>`:''}</div>
 ${open?`<div class="cm">${cs.map(([i,t])=>`<div class="c"><div class="av" style="background:${users[i].c}">${ini(users[i].n)}</div><div><b>${users[i].n}</b> ${esc(t)}</div></div>`).join('')||'<div style="color:var(--soft);font-size:14px">Sé la primera persona en comentar.</div>'}
 <div class="cf"><input placeholder="Escribe un comentario" aria-label="Comentario" data-ci><button data-send>Enviar</button></div><div class="err" data-ce></div></div>`:''}
 </article>`;
}
function feed(){
 let l=posts.slice().sort((a,b)=>a.t0-b.t0);
 if(st.tab==='guardados')l=l.filter(p=>st.saved.has(p.id));else if(st.tab!=='inicio')l=l.filter(p=>p.tipo===st.tab);
 if(st.cat)l=l.filter(p=>p.cat===st.cat);
 if(st.q)l=l.filter(p=>(p.t+p.x+p.lugar).toLowerCase().includes(st.q.toLowerCase()));
 $('#feed').innerHTML=l.length?l.map(post).join(''):`<div class="empty"><b>No encontramos publicaciones</b><p>${st.q?'Prueba con otra palabra o quita el filtro de categoría.':st.tab==='guardados'?'Toca el marcador en una publicación para guardarla aquí.':'Aún no hay nada en esta sección.'}</p></div>`;
}
function side(){
 const up=posts.filter(p=>p.f).sort((a,b)=>a.f-b.f).slice(0,4);
 $('#upcoming').innerHTML=up.map(p=>`<div class="up"><div class="d"><b>${p.f.getDate()}</b><span>${MES[p.f.getMonth()]}</span></div><div>${esc(p.t)}<small>${esc(p.lugar)}</small></div></div>`).join('');
 const m=posts.filter(p=>st.enrolled.has(p.id));
 $('#mine').innerHTML=m.length?m.map(p=>`<div style="padding:5px 0;color:var(--ink)">${esc(p.t)}</div>`).join(''):'Todavía no te has inscrito a ningún evento.';
}
const all=()=>{nav();stories();feed();side();$('#newBtn').style.display=canPost()?'':'none';document.querySelectorAll('.tabs .plus').forEach(b=>b.style.display=canPost()?'':'none')};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}
function openForm(p){
 st.edit=p||null;$('#mt').textContent=p?'Editar publicación':'Nueva publicación';$('#fSave').textContent=p?'Guardar cambios':'Publicar';
 $('#fCat').innerHTML=Object.keys(CAT).map(c=>`<option>${c}</option>`).join('');
 $('#fTitulo').value=p?p.t:'';$('#fTipo').value=p?p.tipo:'evento';$('#fCat').value=p?p.cat:'ACADÉMICO';$('#fDesc').value=p?p.x:'';
 $('#fFecha').value=p&&p.f?p.f.toISOString().slice(0,10):'';$('#fCupo').value=p&&p.cupo?p.cupo:'';$('#fLugar').value=p?p.lugar:'';$('#fErr').textContent='';
 $('#modal').classList.add('open');$('#fTitulo').focus();
}
const closeForm=()=>$('#modal').classList.remove('open');
$('#fCancel').onclick=closeForm;
$('#modal').onclick=e=>{if(e.target.id==='modal')closeForm()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm()});
$('#fSave').onclick=()=>{
 const t=$('#fTitulo').value.trim(),x=$('#fDesc').value.trim(),tipo=$('#fTipo').value,fe=$('#fFecha').value;
 if(!t||!x){$('#fErr').textContent='Completa el título y la descripción para publicar.';return}
 if(tipo!=='noticia'&&!fe){$('#fErr').textContent='Los eventos y convocatorias necesitan una fecha.';return}
 const data={tipo,cat:$('#fCat').value,t,x,f:fe?new Date(fe+'T12:00:00'):null,lugar:$('#fLugar').value.trim(),cupo:+$('#fCupo').value||0};
 if(st.edit){Object.assign(st.edit,data);toast('Cambios guardados')}
 else{posts.push({id:st.nid,u:st.role==='ADMIN'?2:2,ins:0,likes:0,t0:0,...data});com[st.nid++]=[];toast('Publicado')}
 closeForm();all();
};
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){st.tab=b.dataset.tab;all();return}
 if(b.dataset.cat){st.cat=st.cat===b.dataset.cat?null:b.dataset.cat;all();return}
 if(b.hasAttribute('data-new')){openForm();return}
 const a=b.closest('.post');if(!a)return;const id=+a.dataset.id,p=posts.find(x=>x.id===id);
 const flip=(s)=>s.has(id)?s.delete(id):s.add(id);
 if(b.hasAttribute('data-like'))flip(st.liked);
 else if(b.hasAttribute('data-save')){flip(st.saved);toast(st.saved.has(id)?'Guardado':'Quitado de guardados')}
 else if(b.hasAttribute('data-cm'))flip(st.open);
 else if(b.hasAttribute('data-enroll')){flip(st.enrolled);toast(st.enrolled.has(id)?'Inscripción confirmada':'Inscripción cancelada')}
 else if(b.hasAttribute('data-edit')){openForm(p);return}
 else if(b.hasAttribute('data-del')){if(confirm('¿Eliminar esta publicación? Dejará de mostrarse a los estudiantes.')){posts=posts.filter(x=>x.id!==id);toast('Eliminada')}else return}
 else if(b.hasAttribute('data-send')){
  const i=a.querySelector('[data-ci]'),v=i.value.trim();
  if(!v){a.querySelector('[data-ce]').textContent='Escribe algo antes de enviar.';return}
  com[id].push([1,v]);
 }else return;
 all();
});
$('#q').oninput=e=>{st.q=e.target.value;feed()};
$('#roleSel').onchange=e=>{st.role=e.target.value;const m={ESTUDIANTE:['Valentina Rojas','Ing. de Sistemas'],BIENESTAR:['Bienestar UdeC','Publicador'],ADMIN:['Admin UCampus','Administrador']}[st.role];$('#meName').textContent=m[0];$('#meSub').textContent=m[1];$('#meAv').textContent=ini(m[0]);all();toast('Vista de '+m[1].toLowerCase())};
$('#theme').onclick=()=>{const r=document.documentElement,dk=matchMedia('(prefers-color-scheme:dark)').matches;const cur=r.dataset.theme||(dk?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark'};
all();
</script>
</body>
</html>
